plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.vozesinais.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'br.com.vozesinais.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'br.com.vozesinais.app.WhisperSmokeInstrumentation'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17', '-O3'
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    flavorDimensions += 'speech'
    productFlavors {
        device {
            dimension 'speech'
            applicationIdSuffix '.demo'
            versionNameSuffix '-device-demo'
        }
        bundled {
            dimension 'speech'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Configure a private upload key before publishing. Never use the debug key on Play.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['fst', 'mdl', 'int', 'carpa', 'bin']
        // Keep the previous model available in the checkout without shipping two engines.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:model-pt-br'
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register('verifyOfflineModel') {
    doLast {
        def model = file('src/bundled/assets/whisper/ggml-tiny.bin')
        def checksum = file('src/bundled/assets/whisper/ggml-tiny.bin.sha256')
        if (!model.isFile() || !checksum.isFile()) {
            throw new GradleException('Modelo Whisper offline ausente. Prepare ggml-tiny.bin e seu SHA256 antes de gerar a variante bundled.')
        }
        def expected = checksum.text.trim()
        if (!(expected ==~ /[a-fA-F0-9]{64}/)) throw new GradleException('SHA256 do modelo Whisper deve conter somente 64 caracteres hexadecimais.')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        model.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        def actual = digest.digest().encodeHex().toString()
        if (!expected.equalsIgnoreCase(actual)) throw new GradleException('Modelo Whisper rejeitado: SHA256 não corresponde ao arquivo preparado.')
    }
}
tasks.configureEach { task ->
    if (task.name == 'mergeBundledDebugAssets' || task.name == 'mergeBundledReleaseAssets') {
        task.dependsOn tasks.named('verifyOfflineModel')
    }
}
